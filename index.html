<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Little Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Homemade+Apple&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="progress"><i id="bar"></i></div>

  <!-- Music player -->
  <div class="player" id="player">
    <button id="playBtn" aria-label="Play or pause music">♪</button>
    <button id="muteBtn" aria-label="Mute or unmute">🔊</button>
    <span class="eq" aria-hidden="true"><b></b><b></b><b></b></span>
    <span id="songTitle"></span>
  </div>

  <main class="book">
    <div class="stage" id="stage"></div>
  </main>

  <nav class="nav" id="nav">
    <button id="prev">‹ Previous Page</button>
    <span id="pageNum"></span>
    <button id="surprise">✦ Surprise Me</button>
    <button id="restart">Start Over</button>
    <button id="next">Next Page ›</button>
  </nav>

  <div class="lightbox" id="lightbox"><div id="lbContent"></div></div>
  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
